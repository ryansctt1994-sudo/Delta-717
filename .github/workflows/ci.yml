name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install (exact versions from package-lock.json)
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Build
        run: npm run build

  guide:
    # Runs the Python project the setup guide shows, file for file, as the
    # guide tells readers to: pip install -r requirements.txt, python main.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the guide's runtime requirements
        # jupyter is only for the notebook, which the tests check as JSON
        run: python -m pip install "numpy>=1.24.0" "scipy>=1.10.0" "pytest>=8,<9"

      - name: Test the guide's code
        run: python -m pytest -q tests/guide

  claim-audit:
    # Fails on any blocked term (production-ready, validated, safe, ASI, ...)
    # that claims.json neither backs with evidence nor waives with a reason.
    # The auditor is governance.claim_audit from Weaver--Cathedral-, pinned to
    # a commit; bump AUDITOR_REF to update it.
    runs-on: ubuntu-latest
    env:
      AUDITOR_REF: cd34963b48fd05c47c9b4513fda5960a068c2fdc
    steps:
      - uses: actions/checkout@v4

      - name: Check out the claim auditor
        uses: actions/checkout@v4
        with:
          repository: ryansctt1994-sudo/Weaver--Cathedral-
          ref: ${{ env.AUDITOR_REF }}
          path: .claim-auditor

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install auditor dependency
        run: python -m pip install "pydantic>=2.7,<3"

      - name: Audit claims
        run: python .claim-auditor/skills/governance/claim_audit/claim_audit.py . --json claim-audit-report.json

      - name: Upload claim audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-audit-report
          path: claim-audit-report.json
